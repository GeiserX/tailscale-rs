[package]
name = "geiserx_ts_tunnel"
version.workspace = true
description = "secure packet tunnel over udp"
categories = ["cryptography", "network-programming", "encoding"]
keywords = ["tailscale", "wireguard", "tunnel", "udp", "sans-io"]

repository.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true


[lib]
name = "ts_tunnel"
[dependencies]
# Our crates.
ts_keys.workspace = true
ts_packet.workspace = true
ts_time.workspace = true

# Unconditionally required dependencies.
aead.workspace = true
blake2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
itertools.workspace = true
rand.workspace = true
tracing.workspace = true
x25519-dalek.workspace = true
zerocopy.workspace = true
# Wipes WireGuard symmetric key material (the pre-shared `Psk` and the handshake `chaining_key`/
# `hash` intermediates) from memory on drop. The session AEAD keys are already wiped by
# `chacha20poly1305::ChaCha20Poly1305`'s own `ZeroizeOnDrop`; this covers the raw `[u8; 32]` secrets
# that never become a `ts_keys` newtype. Mirrors the redact+zeroize hygiene `ts_keys` already applies
# to the long-lived private keys.
zeroize.workspace = true

[dev-dependencies]
# Dependencies required for examples.
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
hex = "0.4"
tokio = { workspace = true, features = ["full", "macros"] }
ts_cli_util.workspace = true
proptest.workspace = true
# Project Wycheproof ChaCha20Poly1305 adversarial vectors (dev-only KAT). See VENDOR.md.
wycheproof.workspace = true

# Statistical constant-time leakage *detection* (Reparaz dudect t-test) for the AEAD-decrypt /
# tag-compare path. Detects leaks (|max_t| > 5), never *proves* constant-timeness — see
# docs/CRYPTOGRAPHY.md §7. Informational, not part of the default test gate; run on demand with:
#   cargo bench -p geiserx_ts_tunnel --bench constant_time
# The t-test itself lives in `benches/dudect/mod.rs`, vendored from the `dudect-bencher` crate
# rather than depended on: that crate's newest release still pins `clap` 2, which drags in the
# unmaintained, never-patched `atty` (RUSTSEC-2021-0145). See VENDOR.md.
[[bench]]
name = "constant_time"
harness = false

[lints]
workspace = true
