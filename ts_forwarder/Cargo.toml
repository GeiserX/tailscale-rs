[package]
name = "geiserx_ts_forwarder"
version.workspace = true
description = "inbound subnet-router / exit-node forwarding dataplane (overlay accept -> real OS dial)"
readme = "README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
categories = ["network-programming"]
keywords = ["tailscale", "forwarder", "subnet-router", "exit-node", "netstack"]


[lib]
name = "ts_forwarder"
[lints]
workspace = true

[dependencies]
etherparse = "0.19"
# `if-addrs` reads the exit host's interface subnets (libc `getifaddrs` on POSIX), which exit flows
# must not reach. The same crate and version `ts_host_net` and `ts_magicsock` already use.
if-addrs = "0.15"
ts_netstack_smoltcp = { workspace = true, features = ["tokio"] }
ipnet.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
