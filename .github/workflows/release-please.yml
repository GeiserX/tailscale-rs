# Release automation — the *versioning* half. `release.yml` is the *publishing* half.
# They chain through the `v{version}` tag this workflow pushes.
#
#   1. Commits land on `main` as Conventional Commits (feat:, fix:, …).
#   2. release-please maintains a standing "release PR" that bumps the single
#      workspace version (`[workspace.package].version` in Cargo.toml, which all 43
#      crates inherit via `version.workspace = true`) and rewrites CHANGELOG.md.
#   3. That PR is merged — by a human, or automatically (see "Auto-merge" below) —
#      which makes release-please create the GitHub Release + push tag `v{version}`.
#   4. This workflow then dispatches `release.yml` for that tag (the crates.io
#      publish + binaries). It must dispatch explicitly: the tag is pushed with the
#      runner token, and GitHub's recursion guard means a token tag push does NOT
#      trigger `release.yml`'s `on: push: tags`, so the publish would never fire.
#      (An explicit `workflow_dispatch` via the API is exempt from that guard, so the
#      dispatch below DOES start the publish — proven by the v0.31–v0.34 releases.)
#
# Auto-merge (opt-in, requires a PAT):
#   release-please does NOT merge its own release PR — by design, the merge is the
#   "ship it" trigger. To make releases fully hands-off, this workflow enables GitHub
#   native auto-merge on the release PR. THE CATCH: the same recursion guard means a
#   release-PR merge completed by the built-in GITHUB_TOKEN would NOT re-trigger this
#   workflow, so step 3's release/tag would never be cut — the PR would merge into a
#   dead end. So auto-merge is wired to a Personal Access Token (or GitHub App token)
#   stored as the `RELEASE_PLEASE_TOKEN` secret: the action runs as that identity AND
#   completes the merge as that identity, whose push DOES re-trigger the release cut.
#   The auto-merge step is GATED on that secret being present — when it is absent the
#   workflow behaves exactly as before (the release PR waits for a manual merge), so
#   this can never land in a "merged but never released" state. To go hands-off:
#   create a fine-grained PAT for this repo with `contents: write` + `pull-requests:
#   write` (or a classic PAT with `repo` + `workflow`), add it as the repo secret
#   `RELEASE_PLEASE_TOKEN`, and ensure "Allow auto-merge" is enabled in repo settings.
#   (With no branch protection the PR is immediately mergeable, so auto-merge merges
#   as soon as it is enabled; add branch protection on the fast, reliable CI lanes —
#   NOT the flaky self-hosted `hosted test` lane — if you want a green-CI gate.)
#
# Version-bump mechanics (see release-please-config.json): release-type `simple`
# (CHANGELOG + manifest + tag only — it does NOT edit Cargo.toml, so it can't break
# the facade's `version.workspace = true` inheritance) plus an `extra-files` generic
# TOML updater that bumps `$.workspace.package.version`. Pre-1.0: feat→minor,
# fix→patch, breaking→minor (bump-minor-pre-major).
#
# Cargo.lock is bumped by a THIRD extra-files updater, and must be:
#   { "type": "toml", "path": "Cargo.lock", "jsonpath": "$.package[?(!@.source)].version" }
# `!@.source` selects exactly the path/workspace members — a registry package always
# carries `source = "registry+…"`, a workspace member never does — so this rewrites our
# 48 local entries and nothing vendored. Without it the release bumped Cargo.toml but
# left every lock entry on the previous version, so `--locked` builds on a fresh clone
# of main failed with "cannot update the lock file because --locked was passed".
#   Do NOT "fix" this by switching to release-type `rust`. That strategy's CargoToml
# updater only ever writes `['package','version']` and has no concept of
# `[workspace.package]`; against this repo it throws "value at path package.version is
# not tagged" on the root AND every member manifest, which stops releases outright
# (googleapis/release-please#2111, #2478). The `cargo-workspace` plugin is also wrong
# here: it is a no-op unless release-type is `rust`, and would then mint per-crate
# components/tags instead of our single `v{version}` tag.
#   `x-release-please-version` comments cannot be used on Cargo.lock either — cargo
# re-serialises the lockfile from its in-memory model and strips them.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Open/maintain the release PR, and on merge create the release + tag, then
# dispatch the publish workflow.
permissions:
  contents: write
  pull-requests: write
  actions: write

# One run at a time, never cancelled: two quick pushes to main must not interleave a
# release-please force-push with the close and reopen in the last step. A queued run
# that a newer one replaces loses nothing, because release-please reads the current state.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain release PR · cut release on merge
    runs-on: ubuntu-latest
    # Surface whether the hands-off PAT is configured, so the auto-merge step can be
    # gated on it (a secret cannot be referenced directly in a step-level `if:`).
    env:
      HAS_RELEASE_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Prefer the PAT so a release-PR merge (manual OR auto) is attributed to a
          # real identity whose push re-triggers this workflow to cut the release.
          # Falls back to the built-in token when the secret is absent (status quo:
          # a manual merge by a human still works and still triggers the release cut).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Hands-off: enable auto-merge on the standing release PR. Gated on the PAT
      # secret (see the header) so it never enables a merge the release cut can't
      # follow. `--auto` turns on GitHub native auto-merge (merges when the PR's merge
      # requirements are met; immediately if none are configured). Idempotent — safe to
      # run every time the release PR is opened or updated.
      - name: Enable auto-merge on the release PR
        if: ${{ env.HAS_RELEASE_PAT == 'true' && steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          pr_number=$(printf '%s' "$PR_JSON" | jq -r '.number')
          echo "Enabling auto-merge on release PR #${pr_number}"
          gh pr merge --squash --auto --repo "${GITHUB_REPOSITORY}" "${pr_number}"

      # Kick off the crates.io publish + binary build for the freshly-pushed tag.
      # (Why dispatch instead of relying on release.yml's own `on: push: tags`: the
      # release-please tag push uses the runner token, which GitHub deliberately does
      # not let trigger further workflow runs — the recursion guard. release.yml keeps
      # its tag trigger for manual/CLI tag pushes, but a release-please release reaches
      # it only via this explicit dispatch.)
      - name: Dispatch publish for the new tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"

      # Keep the release PR mergeable: up to date with main, with its required checks run.
      #
      # release-please pushes the release branch with the built-in token, and GitHub starts
      # no real workflow run from an event made with that token (it records a `pull_request`
      # run that fails at once with no jobs), so the release PR's required checks never
      # report. A `workflow_dispatch` does not help: its check runs land on the head commit,
      # but GitHub leaves them out of the pull request, so the branch rules stay blocked.
      # The checks must come from a `pull_request` event made by a real identity, so this
      # step acts with the RELEASE_PR_TOKEN secret: a fine-grained PAT for this repository
      # with Contents, Pull requests and Workflows write (Workflows, because updating the
      # branch can bring workflow changes from main into it).
      #
      # release-please only pushes the branch when the release notes change, so a commit
      # that adds no notes (chore:, ci:, a Dependabot bump) leaves the PR behind main, and
      # main requires branches to be up to date. A branch that is behind is updated with
      # the PAT, which starts CI on the new head. Otherwise, a head without its required
      # checks from a `pull_request` run gets the PR closed and reopened with the PAT,
      # which starts CI the same way.
      #
      # The decision comes from the branch and its head commit, so a rerun repairs an
      # interrupted run and an unchanged PR is left alone. The PR is found with a plain
      # list, not `--label` (that goes through search, which lags a PR opened a second
      # ago), and the head is read from the branch ref, not from the PR record, which can
      # lag a force-push.
      # release-please itself uses the built-in token while RELEASE_PLEASE_TOKEN is unset, so
      # the tag push starts nothing and the dispatch above stays the only publish.
      # This step runs last so that its failure can never skip that dispatch.
      - name: Keep the release PR up to date and checked
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set, so the release PR cannot get its required checks."
            exit 1
          fi
          repo=$GITHUB_REPOSITORY
          pr=$(gh pr list --repo "$repo" --state open --limit 200 --json number,headRefName,baseRefName,labels \
            --jq '[.[] | select(any(.labels[]; .name == "autorelease: pending"))][0] // empty')
          if [ -z "$pr" ]; then echo "No open release PR."; exit 0; fi
          number=$(jq -r .number <<<"$pr")
          branch=$(jq -r .headRefName <<<"$pr")
          base=$(jq -r .baseRefName <<<"$pr")
          head=$(gh api "repos/$repo/git/ref/heads/$branch" --jq .object.sha)

          behind=$(gh api "repos/$repo/compare/$base...$head" --jq .behind_by)
          if [ "$behind" -gt 0 ]; then
            echo "Release PR #$number is $behind commit(s) behind $base; updating its branch."
            if ! gh api -X PUT "repos/$repo/pulls/$number/update-branch" \
                -f expected_head_sha="$head" >/dev/null; then
              echo "::error::Could not update the branch of release PR #$number (a merge conflict?). Update it by hand."
              exit 1
            fi
            exit 0
          fi

          # Required checks that came from a pull_request run on this head. Dispatched runs
          # do not count for the PR, and the bot's instant-fail run has no check runs.
          suites=$(gh api --paginate "repos/$repo/actions/runs?head_sha=$head&event=pull_request&per_page=100" \
            --jq '[.workflow_runs[].check_suite_id]' | jq -s 'add // []')
          checks=$(gh api --paginate "repos/$repo/commits/$head/check-runs?per_page=100" \
            --jq '.check_runs[] | {suite: .check_suite.id, name}' \
            | jq -r --argjson suites "$suites" 'select(.suite as $s | $suites | index($s)) | .name')
          required_checks=('musl static (x86_64-unknown-linux-musl)' 'build (strict)')
          for required in "${required_checks[@]}"; do
            if ! grep -qxF "$required" <<<"$checks"; then
              echo "'$required' has no pull_request run on $head; closing and reopening release PR #$number."
              # Reopen only once the PR record shows this head, so CI runs on it.
              for _ in $(seq 1 15); do
                [ "$(gh pr view "$number" --repo "$repo" --json headRefOid --jq .headRefOid)" = "$head" ] && break
                sleep 4
              done
              gh pr close "$number" --repo "$repo"
              gh pr reopen "$number" --repo "$repo" || { sleep 10; gh pr reopen "$number" --repo "$repo"; }
              exit 0
            fi
          done
          echo "Release PR #$number is up to date and its required checks ran on $head."
